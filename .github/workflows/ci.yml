name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-web.txt
            requirements-dev.txt
      # The tests replace torch and whisper with fakes, so CI installs only the
      # web and test packages and never downloads a model.
      - run: python -m pip install -r requirements-dev.txt
      - name: Install FFmpeg for the worker test
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
      - run: python -m pytest -rs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: node --test tests/test_ui.cjs
      - name: Regenerate the example and check it matches the committed file
        run: |
          python examples/make_wav.py /tmp/tone.wav
          cmp /tmp/tone.wav examples/tone.wav
